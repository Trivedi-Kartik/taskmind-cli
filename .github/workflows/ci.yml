# Runs on every push and pull request once this project is on GitHub (free for public repos).
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        include:
          - os: ubuntu-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # higher GitHub API limit for `tm import` in the smoke test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Git identity for tests that make commits
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - name: Bundled guide matches README
        run: python scripts/build.py --check
      - name: Unit tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v 2> test-output.txt
          status=$?
          cat test-output.txt
          if [ $status -ne 0 ]; then python scripts/ci_report.py test-output.txt; fi
          exit $status
      - name: Install like a user would, then smoke-test the installed command
        if: runner.os != 'Windows'
        run: |
          python -m pip install .
          python tests/live_smoke.py --no-ai --tm tm
      - name: Install on Windows and check it starts
        if: runner.os == 'Windows'
        run: |
          python -m pip install .
          tm --version
          tm help reminders
      - name: Single-file build
        run: |
          python scripts/build.py
          python dist/taskmind.pyz --version
